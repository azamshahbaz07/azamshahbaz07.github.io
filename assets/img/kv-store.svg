<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" font-family="Inter,Segoe UI,Arial,sans-serif"><rect width="960" height="510" fill="#f7f6f2"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5b6270"/></marker></defs><text x="40" y="50" font-size="20" font-weight="700" fill="#1c1f24">Persistent Key-Value Store — architecture</text><rect x="60" y="90" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/><text x="160.0" y="124.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">Clients</text><text x="160.0" y="143.0" text-anchor="middle" font-size="12.5" fill="#5b6270">GET / PUT / DELETE</text><rect x="340" y="90" width="240" height="70" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/><text x="460.0" y="124.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">epoll TCP server</text><text x="460.0" y="143.0" text-anchor="middle" font-size="12.5" fill="#5b6270">non-blocking I/O</text><rect x="660" y="90" width="200" height="70" rx="10" fill="#e8effa" stroke="#1f5fbf" stroke-width="2"/><text x="760.0" y="124.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">In-memory index</text><text x="760.0" y="143.0" text-anchor="middle" font-size="12.5" fill="#5b6270">key → (file, offset)</text><line x1="260" y1="125" x2="338" y2="125" stroke="#5b6270" stroke-width="2" marker-end="url(#a)"/><line x1="580" y1="125" x2="658" y2="125" stroke="#5b6270" stroke-width="2" marker-end="url(#a)"/><rect x="340" y="240" width="240" height="70" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/><text x="460.0" y="274.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">Write-ahead log</text><text x="460.0" y="293.0" text-anchor="middle" font-size="12.5" fill="#5b6270">append + CRC32</text><line x1="460" y1="160" x2="460" y2="238" stroke="#5b6270" stroke-width="2" marker-end="url(#a)"/><text x="466.0" y="193.0" font-size="12" fill="#5b6270">write</text><rect x="120" y="370" width="180" height="60" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/><text x="210.0" y="399.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">data.0001</text><text x="210.0" y="418.0" text-anchor="middle" font-size="12.5" fill="#5b6270">immutable</text><rect x="330" y="370" width="180" height="60" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/><text x="420.0" y="399.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">data.0002</text><text x="420.0" y="418.0" text-anchor="middle" font-size="12.5" fill="#5b6270">immutable</text><rect x="540" y="370" width="180" height="60" rx="10" fill="#f3ecd2" stroke="#b3a369" stroke-width="2"/><text x="630.0" y="399.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">data.0003</text><text x="630.0" y="418.0" text-anchor="middle" font-size="12.5" fill="#5b6270">active (append)</text><line x1="460" y1="310" x2="630" y2="368" stroke="#5b6270" stroke-width="2" marker-end="url(#a)"/><rect x="760" y="370" width="140" height="60" rx="10" fill="#ffffff" stroke="#b3a369" stroke-width="2"/><text x="830.0" y="399.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">Compactor</text><text x="830.0" y="418.0" text-anchor="middle" font-size="12.5" fill="#5b6270">live keys only</text><line x1="760" y1="400" x2="722" y2="400" stroke="#5b6270" stroke-width="2" marker-end="url(#a)"/><line x1="760" y1="160" x2="660" y2="368" stroke="#5b6270" stroke-width="2" marker-end="url(#a)"/><text x="722" y="250" font-size="12" fill="#5b6270">read: 1 seek</text><text x="60" y="480" font-size="13" fill="#5b6270">On restart, the log is replayed to rebuild the index; a torn record at the tail fails its CRC check and is discarded.</text></svg>