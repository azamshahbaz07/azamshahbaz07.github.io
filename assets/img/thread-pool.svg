<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter,Segoe UI,Arial,sans-serif"><rect width="900" height="430" fill="#f7f6f2"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5b6270"/></marker></defs><text x="40" y="50" font-size="20" font-weight="700" fill="#1c1f24">Work-stealing thread pool</text><rect x="60" y="90" width="240" height="60" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/><text x="180.0" y="119.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">Worker 0</text><text x="180.0" y="138.0" text-anchor="middle" font-size="12.5" fill="#5b6270">owns one deque</text><rect x="60" y="180" width="240" height="44" rx="6" fill="#ffffff" stroke="#5b6270"/><rect x="70" y="188" width="36" height="28" rx="4" fill="#e8effa" stroke="#1f5fbf"/><rect x="114" y="188" width="36" height="28" rx="4" fill="#e8effa" stroke="#1f5fbf"/><rect x="158" y="188" width="36" height="28" rx="4" fill="#e8effa" stroke="#1f5fbf"/><rect x="202" y="188" width="36" height="28" rx="4" fill="#e8effa" stroke="#1f5fbf"/><rect x="246" y="188" width="36" height="28" rx="4" fill="#e8effa" stroke="#1f5fbf"/><line x1="180" y1="150" x2="180" y2="178" stroke="#5b6270" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="90" width="240" height="60" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/><text x="450.0" y="119.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">Worker 1</text><text x="450.0" y="138.0" text-anchor="middle" font-size="12.5" fill="#5b6270">owns one deque</text><rect x="330" y="180" width="240" height="44" rx="6" fill="#ffffff" stroke="#5b6270"/><rect x="340" y="188" width="36" height="28" rx="4" fill="#e8effa" stroke="#1f5fbf"/><line x1="450" y1="150" x2="450" y2="178" stroke="#5b6270" stroke-width="2" marker-end="url(#a)"/><rect x="600" y="90" width="240" height="60" rx="10" fill="#ffffff" stroke="#1f5fbf" stroke-width="2"/><text x="720.0" y="119.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">Worker 2</text><text x="720.0" y="138.0" text-anchor="middle" font-size="12.5" fill="#5b6270">owns one deque</text><rect x="600" y="180" width="240" height="44" rx="6" fill="#ffffff" stroke="#5b6270"/><line x1="720" y1="150" x2="720" y2="178" stroke="#5b6270" stroke-width="2" marker-end="url(#a)"/><path d="M700,230 C700,300 160,300 160,230" fill="none" stroke="#b3a369" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="430" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#8a7a3a">idle Worker 2 steals from the far end of Worker 0's deque</text><rect x="60" y="340" width="780" height="60" rx="10" fill="#f3ecd2" stroke="#b3a369" stroke-width="2"/><text x="450.0" y="369.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1f24">Thread-caching allocator</text><text x="450.0" y="388.0" text-anchor="middle" font-size="12.5" fill="#5b6270">per-thread free lists → shared pool only on miss</text></svg>